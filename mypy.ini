# ==============================================================================
# Mypy Type Checker Configuration
# Repository: project-forge
# Python: >=3.13 | Strict Mode
# Linked Companion Configs:
#   - Ruff: ruff.toml
#   - Pylint: .pylintrc
# ==============================================================================

[mypy]
files = src
mypy_path = src
python_version = 3.13
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
no_implicit_optional = True
strict_optional = True
pretty = True
strict = True

# Exclude legacy and temporary directories
exclude = (?x)(
    ^scripts
    | ^build
    | ^dist
    | ^docs
    | ^outputs
    | ^backups
    | ^scratch
    | ^\.plan
    | ^\.venv
  )



